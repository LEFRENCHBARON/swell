<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#060606"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2d55" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ff9f0a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Wave shapes -->
  <path d="M0 500 Q200 440 350 470 Q500 500 620 440 Q740 380 880 420 Q1020 460 1200 400 L1200 630 L0 630Z"
    fill="#ff9f0a" opacity="0.12"/>
  <path d="M0 540 Q300 490 480 520 Q660 550 800 490 Q940 430 1100 470 L1200 450 L1200 630 L0 630Z"
    fill="#ff2d55" opacity="0.08"/>

  <!-- Mark (top-left) -->
  <g transform="translate(80,80)">
    <rect width="64" height="64" rx="14" fill="#ff2d55" opacity="0.15"/>
    <g transform="translate(32,32)">
      <ellipse cx="0" cy="-4" rx="9" ry="20" transform="rotate(-15)" fill="#ff2d55"/>
      <path d="M5 12 Q9 20 3.5 20 Q3 17 5 12Z" transform="rotate(-15)" fill="#ff2d55" opacity="0.7"/>
      <ellipse cx="0" cy="-4" rx="3.5" ry="9" transform="rotate(-15)" fill="#ff9f0a" opacity="0.5"/>
    </g>
  </g>

  <!-- Brand name -->
  <text x="165" y="126"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="36" font-weight="800" fill="#ff2d55"
    letter-spacing="-0.5">Shackwave</text>

  <!-- Main title -->
  <text x="80" y="300"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="72" font-weight="800" fill="#ffffff"
    letter-spacing="-2">Shackwave @ Hossegor</text>

  <!-- Subtitle -->
  <text x="80" y="368"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="32" font-weight="400" fill="#ff2d55"
    opacity="0.9">Location de planches à Hossegor</text>

  <!-- URL pill bottom right -->
  <rect x="880" y="560" width="240" height="44" rx="22" fill="#ff2d55" opacity="0.18"/>
  <text x="1000" y="587" text-anchor="middle"
    font-family="system-ui, sans-serif"
    font-size="20" font-weight="600" fill="#ff2d55">shackwave.com</text>
</svg>