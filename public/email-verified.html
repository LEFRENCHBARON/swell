<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email déjà vérifié — Swell</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a1a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #16162a; border: 1px solid #2a2a4a; border-radius: 16px; padding: 48px; max-width: 440px; width: 90%; text-align: center; }
    .icon { font-size: 48px; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
    p { color: #8899bb; font-size: 15px; line-height: 1.6; margin-bottom: 28px; }
    a { display: inline-block; background: #00bfff; color: #000; font-weight: 600; padding: 12px 28px; border-radius: 8px; text-decoration: none; font-size: 15px; }
    a:hover { background: #00d4ff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔗</div>
    <h1>Lien invalide ou expiré</h1>
    <p>Ce lien de vérification a déjà été utilisé ou a expiré (7 jours). Pas de souci — reconnecte-toi et un nouveau lien sera envoyé automatiquement.</p>
    <a href="https://swell.polsia.app/app.html">Se connecter</a>
  </div>
</body>
</html>
