<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swell — Connexion / Inscription</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal: #00B5A3;
      --teal-hover: #00cdb9;
      --teal-glow: rgba(0,181,163,0.35);
      --teal-subtle: rgba(0,181,163,0.08);
      --teal-border: rgba(0,181,163,0.3);
      --white: #ffffff;
      --white-80: rgba(255,255,255,0.82);
      --white-55: rgba(255,255,255,0.55);
      --white-30: rgba(255,255,255,0.30);
      --white-12: rgba(255,255,255,0.12);
      --white-07: rgba(255,255,255,0.07);
      --error: #ff6b6b;
      --error-bg: rgba(255,107,107,0.10);
      --error-border: rgba(255,107,107,0.25);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: linear-gradient(180deg, #0c1e38 0%, #09152a 60%, #08121f 100%);
      background-attachment: fixed;
      color: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      /* Atmospheric glow */
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0,181,163,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 0% 60%, rgba(0,150,140,0.07) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 100% 40%, rgba(26,144,216,0.08) 0%, transparent 55%);
    }

    /* ── Logo ──────────────────────────────────────────────── */
    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--white);
      text-decoration: none;
      display: block;
      text-align: center;
      margin-bottom: 2rem;
      position: relative;
      z-index: 1;
    }
    .logo em { font-style: normal; color: var(--teal); }

    /* ── Card ──────────────────────────────────────────────── */
    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(14,30,56,0.60);
      border: 1px solid var(--white-12);
      border-radius: 22px;
      padding: 2.5rem 2.25rem;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 32px 80px rgba(0,0,0,0.40);
      position: relative;
      z-index: 1;
    }

    /* ── Tab switcher ──────────────────────────────────────── */
    .tabs {
      display: flex;
      background: rgba(0,0,0,0.25);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 2rem;
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 0.65rem 1rem;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: var(--white-55);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      min-height: 40px;
    }
    .tab-btn.active {
      background: var(--white-12);
      color: var(--white);
    }
    .tab-btn:hover:not(.active) { color: var(--white-80); }

    /* ── Forms ─────────────────────────────────────────────── */
    .form { display: none; }
    .form.active { display: block; }

    .field { margin-bottom: 1.1rem; }

    .field-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--white-55);
      margin-bottom: 0.45rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .field-label .hint {
      font-weight: 400;
      color: var(--white-30);
      text-transform: none;
      letter-spacing: 0;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 0.8rem 1rem;
      background: var(--white-07);
      border: 1.5px solid rgba(255,255,255,0.11);
      border-radius: 11px;
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.97rem;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }
    input::placeholder { color: var(--white-30); }
    input:focus {
      border-color: var(--teal);
      background: var(--teal-subtle);
      box-shadow: 0 0 0 3px rgba(0,181,163,0.12);
    }
    input.error-field {
      border-color: var(--error-border);
    }

    /* ── Mode selector ─────────────────────────────────────── */
    .mode-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
      margin-top: 0.2rem;
    }
    .mode-option { position: relative; }
    .mode-option input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }
    .mode-option label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
      padding: 1rem 0.75rem 0.85rem;
      background: var(--white-07);
      border: 1.5px solid rgba(255,255,255,0.10);
      border-radius: 13px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      text-align: center;
      font-size: 0.83rem;
      font-weight: 600;
      color: var(--white-55);
      text-transform: none;
      letter-spacing: 0;
      margin-bottom: 0;
      user-select: none;
    }
    .mode-option label .icon {
      font-size: 1.6rem;
      line-height: 1;
    }
    .mode-option input:checked + label {
      border-color: var(--teal);
      background: var(--teal-subtle);
      color: var(--white);
      box-shadow: 0 0 0 3px rgba(0,181,163,0.12);
    }
    .mode-option label:hover:not(.checked) {
      border-color: rgba(255,255,255,0.22);
      color: var(--white-80);
    }

    /* ── Submit button ─────────────────────────────────────── */
    .btn-submit {
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.9rem 1.5rem;
      background: var(--teal);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
      box-shadow: 0 4px 20px var(--teal-glow);
      letter-spacing: -0.01em;
    }
    .btn-submit:hover:not(:disabled) {
      background: var(--teal-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(0,181,163,0.50);
    }
    .btn-submit:active:not(:disabled) { transform: scale(0.98); }
    .btn-submit:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Messages ──────────────────────────────────────────── */
    .msg {
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 500;
      margin-bottom: 1.2rem;
      display: none;
      line-height: 1.45;
    }
    .msg.error {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: #ff9090;
    }
    .msg.success {
      background: rgba(0,181,163,0.10);
      border: 1px solid var(--teal-border);
      color: #4de8d9;
    }
    .msg.show { display: block; }

    /* ── Switch hint ───────────────────────────────────────── */
    .switch-hint {
      text-align: center;
      margin-top: 1.4rem;
      font-size: 0.85rem;
      color: var(--white-30);
    }
    .switch-hint button {
      background: none;
      border: none;
      color: var(--teal);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .switch-hint button:hover { color: var(--teal-hover); }

    /* ── Back link ─────────────────────────────────────────── */
    .back-link {
      position: relative;
      z-index: 1;
      margin-top: 1.5rem;
      font-size: 0.82rem;
      color: var(--white-30);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--white-55); }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.5rem; border-radius: 18px; }
      .logo { font-size: 1.75rem; margin-bottom: 1.5rem; }
    }
  </style>
</head>
<body>

  <a href="/" class="logo">Swell<em>.</em></a>

  <div class="card">
    <div class="tabs" role="tablist">
      <button class="tab-btn" id="tab-login" role="tab" aria-controls="form-login">Connexion</button>
      <button class="tab-btn" id="tab-register" role="tab" aria-controls="form-register">Inscription</button>
    </div>

    <!-- ── Login ── -->
    <form class="form" id="form-login" novalidate>
      <div id="msg-login" class="msg" role="alert"></div>

      <div class="field">
        <label class="field-label" for="login-email">Adresse email</label>
        <input type="email" id="login-email" name="email"
               placeholder="tu@exemple.com" autocomplete="email" required>
      </div>

      <div class="field">
        <label class="field-label" for="login-password">Mot de passe</label>
        <input type="password" id="login-password" name="password"
               placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn-submit">Se connecter →</button>

      <p class="switch-hint">
        Pas encore de compte ?
        <button type="button" data-switch="register">S'inscrire gratuitement</button>
      </p>
    </form>

    <!-- ── Register ── -->
    <form class="form" id="form-register" novalidate>
      <div id="msg-register" class="msg" role="alert"></div>

      <div class="field">
        <label class="field-label" for="reg-name">Prénom</label>
        <input type="text" id="reg-name" name="name"
               placeholder="Tom" autocomplete="given-name" required>
      </div>

      <div class="field">
        <label class="field-label" for="reg-email">Adresse email</label>
        <input type="email" id="reg-email" name="email"
               placeholder="tu@exemple.com" autocomplete="email" required>
      </div>

      <div class="field">
        <label class="field-label" for="reg-password">
          Mot de passe <span class="hint">(6 caractères min.)</span>
        </label>
        <input type="password" id="reg-password" name="password"
               placeholder="••••••••" autocomplete="new-password" required minlength="6">
      </div>

      <div class="field">
        <label class="field-label">Je veux…</label>
        <div class="mode-selector">
          <div class="mode-option">
            <input type="radio" name="mode" id="mode-rent" value="rent" checked>
            <label for="mode-rent">
              <span class="icon">🏄</span>
              Louer des planches
            </label>
          </div>
          <div class="mode-option">
            <input type="radio" name="mode" id="mode-host" value="host">
            <label for="mode-host">
              <span class="icon">🤙</span>
              Proposer les miennes
            </label>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-submit">Créer mon compte →</button>

      <p class="switch-hint">
        Déjà un compte ?
        <button type="button" data-switch="login">Se connecter</button>
      </p>
    </form>
  </div>

  <a href="/" class="back-link">← Retour à l'accueil</a>

  <script>
    // ── Helpers ──────────────────────────────────────────────────────────────
    function getCookie(name) {
      const m = document.cookie.match('(?:^|;)\\s*' + name + '=([^;]*)');
      return m ? decodeURIComponent(m[1]) : '';
    }

    function showMsg(formId, text, type) {
      const el = document.getElementById('msg-' + formId);
      el.textContent = text;
      el.className = 'msg ' + type + ' show';
    }

    function hideMsg(formId) {
      const el = document.getElementById('msg-' + formId);
      el.className = 'msg';
    }

    function setSubmitting(btn, label) {
      if (label) {
        btn.disabled = true;
        btn.textContent = label;
      } else {
        btn.disabled = false;
      }
    }

    // ── Tab switching ─────────────────────────────────────────────────────
    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('tab-login').classList.toggle('active', isLogin);
      document.getElementById('tab-register').classList.toggle('active', !isLogin);
      document.getElementById('tab-login').setAttribute('aria-selected', String(isLogin));
      document.getElementById('tab-register').setAttribute('aria-selected', String(!isLogin));
      document.getElementById('form-login').classList.toggle('active', isLogin);
      document.getElementById('form-register').classList.toggle('active', !isLogin);
    }

    document.getElementById('tab-login').addEventListener('click', () => switchTab('login'));
    document.getElementById('tab-register').addEventListener('click', () => switchTab('register'));

    document.querySelectorAll('[data-switch]').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.switch));
    });

    // ── Initialisation ────────────────────────────────────────────────────
    async function init() {
      // GET /api/auth/me: initialises session → server sets XSRF-TOKEN cookie
      try {
        const r = await fetch('/api/auth/me');
        const data = await r.json();
        if (data.user) {
          window.location.replace('/app.html');
          return;
        }
      } catch (_) {}

      const params = new URLSearchParams(window.location.search);
      switchTab(params.get('tab') === 'login' ? 'login' : 'register');

      if (params.get('mode') === 'host') {
        const hostRadio = document.getElementById('mode-host');
        if (hostRadio) hostRadio.checked = true;
      }
    }

    init();

    // ── Login submit ──────────────────────────────────────────────────────
    document.getElementById('form-login').addEventListener('submit', async function(e) {
      e.preventDefault();
      hideMsg('login');
      const btn = this.querySelector('.btn-submit');
      setSubmitting(btn, 'Connexion…');

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        showMsg('login', 'Remplis tous les champs.', 'error');
        setSubmitting(btn, null);
        btn.textContent = 'Se connecter →';
        return;
      }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': getCookie('XSRF-TOKEN'),
          },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          const errMsg = res.status === 401
            ? 'Email ou mot de passe incorrect.'
            : (data.error || 'Erreur lors de la connexion.');
          showMsg('login', errMsg, 'error');
          setSubmitting(btn, null);
          btn.textContent = 'Se connecter →';
        } else {
          window.location.replace('/app.html');
        }
      } catch (_) {
        showMsg('login', 'Erreur réseau — vérifie ta connexion.', 'error');
        setSubmitting(btn, null);
        btn.textContent = 'Se connecter →';
      }
    });

    // ── Register submit ───────────────────────────────────────────────────
    document.getElementById('form-register').addEventListener('submit', async function(e) {
      e.preventDefault();
      hideMsg('register');
      const btn = this.querySelector('.btn-submit');
      setSubmitting(btn, 'Création du compte…');

      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const modeEl = document.querySelector('input[name="mode"]:checked');
      const mode = modeEl ? modeEl.value : 'rent';

      if (!name || !email || !password) {
        showMsg('register', 'Remplis tous les champs.', 'error');
        setSubmitting(btn, null);
        btn.textContent = 'Créer mon compte →';
        return;
      }
      if (password.length < 6) {
        showMsg('register', 'Le mot de passe doit faire au moins 6 caractères.', 'error');
        setSubmitting(btn, null);
        btn.textContent = 'Créer mon compte →';
        return;
      }

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': getCookie('XSRF-TOKEN'),
          },
          body: JSON.stringify({ email, name, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          let errMsg;
          if (res.status === 409 || data.error === 'Email already registered') {
            errMsg = 'Cet email est déjà utilisé. ';
            showMsg('register', errMsg, 'error');
            const msgEl = document.getElementById('msg-register');
            const switchBtn = document.createElement('button');
            switchBtn.type = 'button';
            switchBtn.textContent = 'Se connecter ?';
            switchBtn.style.cssText = 'background:none;border:none;color:#00B5A3;font-weight:700;cursor:pointer;font-size:inherit;padding:0;text-decoration:underline;';
            switchBtn.addEventListener('click', () => switchTab('login'));
            msgEl.appendChild(switchBtn);
          } else {
            errMsg = data.error || "Erreur lors de l'inscription.";
            showMsg('register', errMsg, 'error');
          }
          setSubmitting(btn, null);
          btn.textContent = 'Créer mon compte →';
        } else {
          window.location.replace(mode === 'host' ? '/host.html' : '/app.html');
        }
      } catch (_) {
        showMsg('register', 'Erreur réseau — vérifie ta connexion.', 'error');
        setSubmitting(btn, null);
        btn.textContent = 'Créer mon compte →';
      }
    });
  </script>
</body>
</html>
